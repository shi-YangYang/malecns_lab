[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "malecns_lab"
version = "0.1.0"
description = "Trainable neural motion decoding from connectome models to device-independent control targets."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["connectome", "drosophila", "drone", "spiking-neural-network", "neuromorphic", "malecns", "flywire", "robotics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
vision = ["opencv-python>=4.8"]
analysis = ["opencv-python>=4.8", "matplotlib>=3.7"]
data = ["pyarrow>=14", "pandas>=2.0"]
tello = ["djitellopy>=2.5", "opencv-python>=4.8"]
dev = ["pytest>=7", "ruff>=0.4"]
train = ["torch==2.14.1", "psutil>=5.9"]
all = ["opencv-python>=4.8", "matplotlib>=3.7", "pyarrow>=14", "pandas>=2.0", "djitellopy>=2.5"]

[project.scripts]
malecns_lab = "malecns_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
malecns_lab = ["defaults.yaml"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
